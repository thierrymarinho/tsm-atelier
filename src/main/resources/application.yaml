spring:
  application:
    name: tsm-atelier

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tsm_atelier}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    placeholders:
      admin_password_hash: ${ADMIN_PASSWORD_HASH:$2a$10$U7EJsOg3No2BaPaXFnKWpOEFWXgOHhPQ5UBdS7SWgW8xWBWNhTB1C}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        default_batch_fetch_size: 16
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  forward-headers-strategy: FRAMEWORK

logging:
  level:
    root: INFO
    com.tm.tsm_atelier: ${LOG_LEVEL:INFO}
    org.hibernate: WARN
  pattern:
    level: "%5p [%X{requestId:--}]"

jwt:

  secret: ${JWT_SECRET}
  access-token-expiration: 900000 # 15 minutos em ms
  refresh-token-expiration: 604800000 # 7 dias em ms

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email-verification-expiration: 86400000 # 24h em ms

stripe:
  api-key: ${STRIPE_API_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
