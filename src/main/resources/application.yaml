spring:
  application:
    name: tsm-atelier

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tsm_atelier}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        default_batch_fetch_size: 16
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  forward-headers-strategy: FRAMEWORK

logging:
  level:
    root: INFO
    # Ajustável por variável de ambiente: dá para subir para DEBUG e investigar um
    # incidente em produção sem alterar código nem refazer o deploy.
    com.tm.tsm_atelier: ${LOG_LEVEL:INFO}
    # Silencia o banner e a validação de schema a cada boot. Avisos continuam
    # passando — inclusive o HHH000104, que denuncia paginação em memória.
    org.hibernate: WARN
  pattern:
    # Injeta o id da requisição (RequestIdFilter) no lugar reservado ao nível de
    # log, sem substituir o padrão do Boot. Fora de uma requisição — scheduler,
    # boot — o campo aparece como "-".
    level: "%5p [%X{requestId:--}]"

jwt:
  secret: ${JWT_SECRET:super-secret-key-for-jwt-generation-tsm-atelier}
  access-token-expiration: 60000 # 15 minutos em ms
  refresh-token-expiration: 604800000 # 7 dias em ms

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email-verification-expiration: 86400000 # 24h em ms

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_fake_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
