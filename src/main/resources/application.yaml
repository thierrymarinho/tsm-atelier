spring:
  application:
    name: tsm-atelier

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tsm_atelier}
    username: ${DB_USER:postgres}
    # Sem default: "postgres" funcionava calado em qualquer ambiente que aceitasse
    # essa senha, inclusive um que não deveria.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        default_batch_fetch_size: 16
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  forward-headers-strategy: FRAMEWORK

logging:
  level:
    root: INFO
    # Ajustável por variável de ambiente: dá para subir para DEBUG e investigar um
    # incidente em produção sem alterar código nem refazer o deploy.
    com.tm.tsm_atelier: ${LOG_LEVEL:INFO}
    # Silencia o banner e a validação de schema a cada boot. Avisos continuam
    # passando — inclusive o HHH000104, que denuncia paginação em memória.
    org.hibernate: WARN
  pattern:
    # Injeta o id da requisição (RequestIdFilter) no lugar reservado ao nível de
    # log, sem substituir o padrão do Boot. Fora de uma requisição — scheduler,
    # boot — o campo aparece como "-".
    level: "%5p [%X{requestId:--}]"

jwt:
  # Sem default de propósito. O valor anterior estava versionado aqui, então
  # qualquer pessoa com acesso ao repositório podia assinar um token válido e se
  # passar por qualquer conta cujo e-mail conhecesse. Faltando a variável, a
  # aplicação não sobe — um container que morre é visível, um que sobe com chave
  # pública não é.
  secret: ${JWT_SECRET}
  # Eram 60000 (1 minuto) com um comentário dizendo 15. O valor agora é o que o
  # comentário sempre afirmou. Um minuto forçava o SPA a renovar a sessão a cada
  # 60s, gastando uma rotação de refresh token por usuário por minuto no Redis, e
  # deixava a janela de graça de 30s cobrindo metade da vida do token.
  access-token-expiration: 900000 # 15 minutos em ms
  refresh-token-expiration: 604800000 # 7 dias em ms

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email-verification-expiration: 86400000 # 24h em ms

stripe:
  # Sem default: com a chave falsa a aplicação subia normalmente e só quebrava no
  # primeiro checkout de um cliente real.
  api-key: ${STRIPE_API_KEY}
  # Sem default de propósito. Com segredo vazio a verificação de assinatura não
  # falha: o Stripe calcula o HMAC com chave vazia e quem soubesse disso poderia
  # forjar um payment_intent.succeeded, marcando pedidos como pagos. A rota é
  # pública, então essa assinatura é a única barreira que ela tem.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
